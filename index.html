*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif}
button,input{font:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--p);border-bottom:2px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font:900 22px "Arial Black",Impact,sans-serif;letter-spacing:-1px;color:var(--ac)}.logo i{color:var(--ac2);font-style:normal}
nav{display:flex;gap:6px;flex:1}nav button{background:none;border:0;color:var(--mu);padding:8px 14px;border-radius:6px;font-weight:700}
nav button.on{background:var(--p2);color:var(--ac)}
.me{display:flex;align-items:center;gap:10px}.bal{color:var(--ac2);font-weight:800}
.av{width:38px;height:38px;border-radius:50%;background:var(--t) center/cover;border:2px solid var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:800}.btn:hover{filter:brightness(1.1)}
.btn.g{background:var(--p2);color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.4}
main{max-width:1100px;margin:0 auto;padding:20px 14px 60px}
h2{margin:6px 0 16px;font:800 26px "Arial Black",sans-serif;text-align:center}
.tk{background:var(--t) center/contain no-repeat}
.rb{filter:hue-rotate(0)}.rb{animation:rb 3s linear infinite}@keyframes rb{to{filter:hue-rotate(360deg) saturate(2)}}
.bonus{display:flex;align-items:center;gap:18px;background:var(--p);border:1px dashed var(--ac);border-radius:12px;padding:12px 18px;margin-bottom:22px}
.bonus .tk{width:90px;height:78px;cursor:pointer;transition:transform .08s}.bonus .tk:active{transform:scale(.88) rotate(-4deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.case{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:center;cursor:pointer}
.case:hover{border-color:var(--ac)}.case .tk{height:96px;margin-bottom:8px}.case small{color:var(--mu)}
.price{display:inline-block;margin-top:8px;border:1px solid var(--ac2);color:var(--ac2);padding:2px 12px;border-radius:4px;font-weight:700}
.card{background:var(--p);border:1px solid var(--ln);border-bottom:3px solid var(--c);border-radius:8px;padding:8px;text-align:center;position:relative;cursor:default}
.card .tk{height:70px}.card b{display:block;font-size:12px}.card em{font-style:normal;color:var(--ac2);font-size:12px}
.card.sel{outline:2px solid var(--ac2)}.pick{cursor:pointer}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;overflow:auto}
.box{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:20px;width:min(560px,100%);max-height:96%;overflow:auto}
.box input{width:100%;margin:5px 0 10px;padding:10px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:6px}
.steam{background:#1b2838;color:#c7d5e0}.steam .btn{background:linear-gradient(#47bfff,#1a44c2);color:#fff;width:100%}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.win{position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--ln);border-radius:8px;margin:12px 0;height:130px}
.win:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--ac2);box-shadow:0 0 12px var(--ac2)}
.strip{display:flex;height:100%;align-items:center;will-change:transform}
.strip .card{flex:0 0 120px;margin:0 5px}
.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pf>div{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:14px}
.pf h3{margin:0 0 6px;color:var(--ac)}.pf small{color:var(--mu)}.pf .mid{text-align:center;grid-row:span 2}
.pf .av{width:110px;height:110px;margin:8px auto;border-width:3px}
.pf input{width:100%;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:8px;border-radius:6px;margin:6px 0}

({tick:()=>tn(900+Math.random()*120,.05,0,'square',.35),click:()=>tn(520,.07,0,'triangle'),coin:()=>{tn(988,.08);tn(1319,.15,.07)},open:()=>tn(150,.5,0,'sawtooth',.5),lose:()=>{tn(220,.3,0,'sawtooth',.6);tn(147,.5,.2,'sawtooth',.6)},win:()=>{for(let i=0;i<3+r;i++)tn(330*Math.pow(1.25,i),.3,i*.09,'triangle')}})[k]()}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('button,.case,.pick'))snd('click')});
function sets(){const s=st_();modal(`<h2 style="font-size:20px">Настройки</h2><label><input type="checkbox" style="width:auto" id="s1" ${s.snd?'checked':''}> Звук</label><br><label>Громкость</label><input type="range" id="s2" min="0" max="1" step=".05" value="${s.vol}"><label>Скорость анимации</label><select id="s3">${[[7,'Медленно'],[5,'Обычно'],[2.2,'Быстро'],[.4,'Мгновенно']].map(a=>`<option value="${a[0]}" ${s.dur==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><label>Сортировка предметов</label><select id="s4">${[[1,'Дорогие сверху'],[2,'Дешёвые сверху'],[0,'Новые сверху']].map(a=>`<option value="${a[0]}" ${s.sort==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><label>Скрывать предметы дешевле, ₽</label><input id="s5" type="number" min="0" value="${s.min}"><button class="btn" onclick="saveS()">Сохранить</button>`)}
function saveS(){const s=st_();s.snd=$('#s1').checked?1:0;s.vol=+$('#s2').value;s.dur=+$('#s3').value;s.sort=+$('#s4').value;s.min=+$('#s5').value||0;save();closeM();snd('win');go()}
const inv=()=>{const s=st_();return U.inv.filter(x=>x.p>=s.min||sel.has(x.u)).reverse().sort((a,b)=>s.sort==1?b.p-a.p:s.sort==2?a.p-b.p:0)};
// ---------- Уровни, достижения, эффекты ----------
const LV=u=>{const x=u.st.xp||0,l=Math.floor(Math.sqrt(x/40))+1,a=40*(l-1)**2,b=40*l*l;return[l,(x-a)/(b-a)*100]};
function xp(n){const a=LV(U)[0];U.st.xp=(U.st.xp||0)+n;const b=LV(U)[0];if(b>a){U.bal+=b*50;toast('Уровень '+b+'! Награда '+fmt(b*50));snd('win',5);boom()}ach()}
const AA=[['Первый кейс','Открой кейс',u=>u.st.o>=1],['Коллекционер','Открой 25 кейсов',u=>u.st.o>=25],['Заядлый','Открой 100 кейсов',u=>u.st.o>=100],['Рискованный','Сделай апгрейд',u=>u.st.u>=1],['Везунчик','Выиграй апгрейд',u=>(u.st.w||0)>=1],['Барыга','Продай предметов на 1000 ₽',u=>(u.st.sold||0)>=1000],['Золото','Получи редкий предмет',u=>u.st.best&&S[u.st.best.i][4]==6],['Богач','Накопи 10 000 ₽',u=>u.bal>=1e4]];
function ach(){if(!U)return;U.ac=U.ac||[];AA.forEach((a,k)=>{if(!U.ac.includes(k)&&a[2](U)){U.ac.push(k);setTimeout(()=>{toast('🏆 Достижение: '+a[0]);snd('win',4)},700)}})}
function boom(){for(let i=0;i<70;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360} 90% 60%);--x:${Math.random()*200-100}px;animation-duration:${1.5+Math.random()*1.5}s;animation-delay:${Math.random()*.4}s`;document.body.append(e);setTimeout(()=>e.remove(),3600)}}
const fl=(e,t)=>{const x=document.createElement('b');x.className='fl';x.textContent=t;x.style.left=e.clientX+'px';x.style.top=e.clientY+'px';document.body.append(x);setTimeout(()=>x.remove(),900)};
function ov(ok,it){const e=document.createElement('div');e.className='ov '+(ok?'win':'lose');e.innerHTML=`<div><h1>${ok?'УСПЕХ!':'НЕУДАЧА'}</h1>${it?card(it):''}<p>${ok?'+ '+fmt(it.p):'Билеты сгорели'}</p></div>`;e.onclick=()=>e.remove();document.body.append(e);setTimeout(()=>e.remove(),3000);if(ok)boom();else{document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),520)}}
let pk=new Set(),ck=new Set();
function sell(us){const L=U.inv.filter(x=>us.includes(x.u)),v=L.reduce((a,x)=>a+x.p,0);if(!L.length)return toast('Нечего продавать');U.inv=U.inv.filter(x=>!us.includes(x.u));U.bal+=v;U.st.sold=(U.st.sold||0)+v;pk=new Set([...pk].filter(u=>!us.includes(u)));snd('coin');toast('Продано '+L.length+' шт. за '+fmt(v));ach();go()}
// ---------- Лента друзей ----------
const NK=['Саня','Димон','Лёха','Макс','Вован','Тёма','Серый','Ромка','Кир','Женёк'];let feed=[],ON=7+Math.floor(Math.random()*9);
const fake=()=>({n:NK[Math.floor(Math.random()*NK.length)],s:S[(Math.random()<.5?0:168)+Math.floor(Math.pow(Math.random(),3)*168)]});
const feedH=()=>feed.map(f=>`<div class="fd" style="--c:${f.s[2]}">${tk(f.s)}<span><b>${f.n}</b><br><small>${f.s[0]}</small></span></div>`).join('');
const onl=()=>(ON=Math.max(3,ON+Math.floor(Math.random()*3)-1));
for(let i=0;i<12;i++)feed.push(fake());
setInterval(()=>{feed.unshift(fake());feed.length=14;const e=$('#feed');if(e)e.innerHTML=feedH();const o=$('#onl');if(o)o.textContent=onl()},2500);
// ---------- Кейсы ----------
let tab=0,kd=0;
function cases(){const T=[['Все',0,1e9],['Дешёвые',0,100],['Средние',100,2000],['Дорогие',2000,1e9]];
$('#main').innerHTML=`<section class="hero"><div><h1>ticket<i> - </i>drop</h1><p>Открывай кейсы, апгрейдь билеты и собирай коллекцию Тикетов с выхода из city. Клик по Тикету — +1 ₽.</p><div class="row" style="justify-content:flex-start"><button class="btn" onclick="bonus()">🎁 Бонус +25 ₽</button><span class="chip">Онлайн: <b id="onl">${onl()}</b></span><span class="chip">Кейсов: ${C.length}</span><span class="chip">Скинов: ${S.length}</span></div></div><div class="tk float" id="clk"></div></section>
<div class="feed" id="feed">${feedH()}</div><div class="tabs"><button class="btn ${kd?'g':''}" onclick="kd=0;cases()">🎫 Тикеты</button><button class="btn ${kd?'':'g'}" onclick="kd=1;cases()">🪒 Бритвы</button><span style="flex:1"></span>${T.map((t,i)=>`<button class="btn ${tab==i?'':'g'}" onclick="tab=${i};cases()">${t[0]}</button>`).join('')}</div>
<div class="grid cg">${C.map((c,i)=>[c,i]).filter(([c])=>c[3]==kd&&c[1]>=T[tab][1]&&c[1]<T[tab][2]).map(([c,i])=>{const top=S[c[2][c[2].length-1][0]],h=(i*47+(kd?200:0))%360;return`<div class="cs" style="--h:${h};--c:${top[2]}" onclick="openCase(${i})"><b>${c[0]}</b><small>${c[2].length} предметов</small><div class="art"><div class="it">${tk(top)}</div><div class="ch">${kd?'RAZOR':'TICKET'}-DROP</div></div><span class="price">${fmt(c[1])}</span></div>`}).join('')}</div>`;
$('#clk').onclick=e=>{if(!need())return;U.bal+=1;fl(e,'+1 ₽');snd('coin');head();save()}}
function bonus(){if(!need())return;const w=Math.ceil((60000-(Date.now()-(U.bt||0)))/1000);if(w>0)return toast('Следующий бонус через '+w+' с');U.bt=Date.now();U.bal+=25;snd('coin');toast('+25 ₽');head();save()}
const tot=c=>c[2].reduce((a,b)=>a+b[1],0);
function roll(c){let r=Math.random()*tot(c);for(const[i,w]of c[2]){if((r-=w)<0)return i}return c[2][0][0]}
function openCase(n){const c=C[n],T=tot(c);modal(`<h2 style="font-size:22px;text-align:center">${c[0]} · ${fmt(c[1])}</h2><div class="win"><div class="strip" id="st"></div></div><div class="row"><button class="btn" id="go" onclick="spinCase(${n})">Открыть за ${fmt(c[1])}</button><button class="btn g" id="cl" onclick="closeM()">Закрыть</button></div><div id="res"></div><small>Содержимое кейса:</small><div class="inv">${[...c[2]].reverse().map(([i,w])=>card(mk(i),'',(w/T*100).toFixed(2)+'% · '+fmt(S[i][1]))).join('')}</div>`,'wide');
$('#st').innerHTML=Array.from({length:8},(_,k)=>card(mk(c[2][k][0]))).join('')}
function spinCase(n){if(!need()||spin)return;const c=C[n],d=st_().dur;if(U.bal<c[1])return toast('Не хватает рублей — забери бонус или покликай по Тикету');
U.bal-=c[1];U.st.o++;xp(Math.ceil(c[1]/2));head();spin=true;$('#go').disabled=$('#cl').disabled=true;$('#res').innerHTML='';snd('open');
const W=52,items=Array.from({length:60},()=>mk(roll(c))),st=$('#st');st.style.transition='none';st.style.transform='none';st.innerHTML=items.map(x=>card(x)).join('');st.offsetWidth;const win=st.parentElement.clientWidth;
st.style.transition=`transform ${d}s cubic-bezier(.12,.6,.1,1)`;st.style.transform=`translateX(${-(W*130+65-win/2+(Math.random()*70-35))}px)`;
for(let i=1;i<40;i++)setTimeout(()=>snd('tick'),d*1000*(1-Math.sqrt(1-i/40)));
setTimeout(()=>{spin=false;const it=items[W],s=S[it.i];U.inv.push(it);if(!U.st.best||it.p>U.st.best.p)U.st.best=it;save();head();snd('win',s[4]);if(s[4]>=4)boom();$('#go').disabled=$('#cl').disabled=false;
$('#res').innerHTML=`<div class="reveal" style="--c:${s[2]}">${card(it)}<div>Выпало: <b style="color:${s[2]}">${it.n}</b><br>${R[s[4]]} · ${fmt(it.p)}<br><button class="btn g" onclick="sell(['${it.u}']);this.disabled=true">Продать сразу</button></div></div>`},d*1000+150)}
// ---------- Апгрейд ----------
const sum=()=>U?U.inv.filter(x=>sel.has(x.u)).reduce((a,b)=>a+b.p,0):0;
function up(){if(!U)return $('#main').innerHTML='<h2>Апгрейд</h2><p style="text-align:center">Войди, чтобы апгрейдить билеты. <button class="btn" onclick="auth()">Войти</button></p>';
sel=new Set([...sel].filter(u=>U.inv.some(x=>x.u==u)));
$('#main').innerHTML=`<h2>Апгрейд</h2><div class="up"><div class="pan" id="L"></div><div><div class="wheel" id="wh"><div class="ptr" id="pt"></div><div><b id="pc"></b><br><small id="lb"></small></div></div><input type="range" id="rg" min="1" max="95" value="${pct}"><button class="btn" style="width:100%" id="ub" onclick="doUp()">Апгрейд</button><div class="row">${[['x2',50],['x5',20],['x10',10],['30%',30],['50%',50],['70%',70]].map(a=>`<button class="btn g" onclick="setP(${a[1]})">${a[0]}</button>`).join('')}<button class="btn g" onclick="setP(1+Math.floor(Math.random()*95))">🔀</button></div></div><div class="pan" id="Rr"></div></div>
<div class="row"><button class="btn g" onclick="inv().forEach(x=>sel.add(x.u));draw()">Выбрать всё</button><button class="btn g" onclick="sel.clear();draw()">Сбросить</button><label>Цена цели, ₽ <input id="tp" type="number" min="1" style="width:130px;padding:8px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:6px"></label><button class="btn g" onclick="setT()">Подобрать шанс</button><button class="btn g" onclick="sets()">⚙ Настройки</button></div>
<div class="hist">${(U.hist||[]).map(h=>`<span class="${h.ok?'ok':'no'}">${h.ok?'✔':'✘'} ${fmt(h.fr)}→${fmt(h.to)}</span>`).join('')}</div><h2 style="font-size:18px;margin-top:20px">Мои предметы</h2><div class="inv" id="iv"></div>`;
$('#rg').oninput=e=>{pct=+e.target.value;draw()};draw()}
const setP=p=>{pct=p;$('#rg').value=p;draw()};
function setT(){const t=+$('#tp').value,s=sum();if(!s||t<=s)return toast('Выбери предметы и укажи цену выше ставки');setP(Math.min(95,Math.max(1,Math.round(s/t*100))))}
function tgt(){const t=Math.round(sum()*100/pct*100)/100;let i=0;S.forEach((s,k)=>{if(s[1]<=t&&s[1]>=S[i][1])i=k});return mk(i,t,'Апгрейд-Тикет ×'+(100/pct).toFixed(2))}
function draw(){const s=sum();$('#wh').style.setProperty('--d',pct*3.6+'deg');$('#pc').textContent=pct.toFixed(2)+'%';$('#lb').textContent=pct<35?'рискованно':pct<65?'средний шанс':'надёжно';
$('#L').innerHTML=s?`<b>Ставка: ${fmt(s)}</b><div class="inv">${U.inv.filter(x=>sel.has(x.u)).map(x=>card(x)).join('')}</div>`:'<b>Выбери свои билеты</b><br><small>Можно несколько — клик по предмету внизу.</small>';
$('#Rr').innerHTML=s?`<b>Получишь</b><div class="inv" style="grid-template-columns:1fr">${card(tgt())}</div>`:'<b>Выбери предмет для апгрейда</b><br><small>Цена цели = ставка × 100 / шанс</small>';
$('#iv').innerHTML=U.inv.length?inv().map(x=>card(x,'pick '+(sel.has(x.u)?'sel':''))).join(''):'<small>Инвентарь пуст — открой кейс.</small>';
document.querySelectorAll('#iv .card').forEach(e=>e.onclick=()=>{sel.has(e.dataset.u)?sel.delete(e.dataset.u):sel.add(e.dataset.u);draw()})}
function doUp(){if(spin)return;if(!sum())return toast('Выбери предметы для апгрейда');spin=true;$('#ub').disabled=true;const d=st_().dur,t=tgt(),fr=sum(),r=Math.random()*360,ok=r<pct*3.6,pt=$('#pt');snd('open');$('#wh').classList.add('spin');
pt.style.transition='none';pt.style.transform='rotate(0)';pt.offsetWidth;pt.style.transition=`transform ${d}s cubic-bezier(.15,.7,.1,1)`;pt.style.transform=`rotate(${1800+r}deg)`;
for(let i=1;i<50;i++)setTimeout(()=>snd('tick'),d*1000*(1-Math.sqrt(1-i/50)));
setTimeout(()=>{spin=false;U.inv=U.inv.filter(x=>!sel.has(x.u));U.st.u++;sel.clear();U.hist=(U.hist||[]).concat({ok,fr,to:t.p}).slice(-8);xp(Math.ceil(fr/4));
if(ok){U.inv.push(t);if(!U.st.best||t.p>U.st.best.p)U.st.best=t;U.st.w=(U.st.w||0)+1;snd('win',S[t.i][4]);ov(1,t)}else{snd('lose');ov(0)}up();head();save()},d*1000+200)}
// ---------- Профиль ----------
function prof(){if(!U)return $('#main').innerHTML='<h2>Профиль</h2><p style="text-align:center">Нужен вход. <button class="btn" onclick="auth()">Войти</button></p>';
const b=U.st.best,total=U.inv.reduce((a,x)=>a+x.p,0),pv=U.inv.filter(x=>pk.has(x.u)).reduce((a,x)=>a+x.p,0);
$('#main').innerHTML=`<h2>Профиль</h2><div class="pf">
<div><h3>TRADE URL</h3><small>Трейд-ссылка сохранена</small><input value="https://steamcommunity.com/tradeoffer/new/?partner=ticket"><button class="btn g" onclick="toast('Ссылка обновлена')">Обновить</button></div>
<div class="mid"><small>${U.nick}</small><div class="av"></div><div class="bal" style="font-size:22px">${fmt(U.bal)}</div><button class="btn" onclick="bonus()">Бонус +25 ₽</button><h3 style="margin-top:16px">Лучший дроп</h3>${b?card(b):'<small>Пока нет</small>'}</div>
<div><h3>Персональный купон</h3><input placeholder="Введи код купона"><button class="btn g" onclick="toast('Купон не найден')">Применить</button></div>
<div><h3>Статистика аккаунта</h3><p>📦 ${U.st.o} открыто · ⬆ ${U.st.u} апгрейдов · 🎫 ${U.inv.length} в инвентаре</p><small>Выведено в Steam: 0 ₽ · 0 предметов</small></div>
<div><h3>E-mail</h3><small>E-mail не добавлен</small></div></div>
<h2 style="margin-top:30px;font-size:20px">Достижения</h2><div class="ach">${AA.map((a,k)=>`<span class="chip ${(U.ac||[]).includes(k)?'ok':''}" title="${a[1]}">${a[0]}</span>`).join('')}</div><h2 style="margin-top:30px;font-size:20px">Ваши предметы</h2><div class="row" style="justify-content:space-between"><span>Всего: ${U.inv.length} · выбрано: ${pk.size}</span><span class="row" style="margin:0"><button class="btn" onclick="sell([...pk])">Продать выбранные ${fmt(pv)}</button><button class="btn g" onclick="sell(U.inv.filter(x=>S[x.i][4]<=1).map(x=>x.u))">Продать ширпотреб</button><button class="btn g" onclick="sell(U.inv.map(x=>x.u))">Продать всё ${fmt(total)}</button><button class="btn g" onclick="pk=new Set(inv().map(x=>x.u));prof()">Выбрать всё</button><button class="btn g" onclick="sets()">⚙</button></span></div>
<div class="inv">${U.inv.length?inv().map(x=>card(x,'pick '+(pk.has(x.u)?'sel':''))).join(''):'<small>Пусто — иди открывать кейсы.</small>'}</div>`;
document.querySelectorAll('.inv .card').forEach(e=>{const u=e.dataset.u;if(!u)return;e.onclick=()=>{pk.has(u)?pk.delete(u):pk.add(u);prof()};const it=U.inv.find(x=>x.u==u),b=document.createElement('div');b.innerHTML=`<button class="btn g" style="margin-top:6px;padding:4px 8px;font-size:12px" onclick="event.stopPropagation();sell(['${u}'])">Продать ${fmt(it.p)}</button><button class="btn g" style="margin-top:4px;padding:4px 8px;font-size:12px" onclick="event.stopPropagation();toast('Вывод временно недоступен')">Вывести</button>`;e.append(b)})}
// ---------- Контракт ----------
function con(){if(!U)return $('#main').innerHTML='<h2>Контракт</h2><p style="text-align:center">Войди, чтобы подписывать контракты. <button class="btn" onclick="auth()">Войти</button></p>';
ck=new Set([...ck].filter(u=>U.inv.some(x=>x.u==u)));const L=U.inv.filter(x=>ck.has(x.u)),v=L.reduce((a,x)=>a+x.p,0);
$('#main').innerHTML=`<h2>Контракт</h2><div class="pan" style="max-width:640px;margin:auto"><b>Выбрано: ${L.length}/10 · ${fmt(v)}</b><p style="color:var(--mu)">Положи от 3 до 10 предметов — получишь один случайный предмет ценой от 0.5× до 2× от суммы.</p><div class="inv">${L.map(x=>card(x)).join('')}</div><button class="btn" style="margin-top:12px" onclick="doCon()">Подписать контракт</button></div><h2 style="font-size:18px;margin-top:20px">Мои предметы</h2><div class="inv" id="iv">${inv().map(x=>card(x,'pick '+(ck.has(x.u)?'sel':''))).join('')||'<small>Инвентарь пуст</small>'}</div>`;
document.querySelectorAll('#iv .card').forEach(e=>e.onclick=()=>{const u=e.dataset.u;if(ck.has(u))ck.delete(u);else if(ck.size<10)ck.add(u);else toast('Максимум 10 предметов');con()})}
function doCon(){const L=U.inv.filter(x=>ck.has(x.u));if(L.length<3)return toast('Нужно минимум 3 предмета');const v=L.reduce((a,x)=>a+x.p,0);let P=S.map((s,k)=>k).filter(k=>S[k][1]>=v*.5&&S[k][1]<=v*2);if(!P.length)P=[S.reduce((b,s,k)=>Math.abs(s[1]-v)<Math.abs(S[b][1]-v)?k:b,0)];
const it=mk(P[Math.floor(Math.pow(Math.random(),1.3)*P.length)]);U.inv=U.inv.filter(x=>!ck.has(x.u));ck.clear();U.inv.push(it);if(!U.st.best||it.p>U.st.best.p)U.st.best=it;snd('win',S[it.i][4]);xp(Math.ceil(v/5));
modal(`<h2 style="font-size:22px;text-align:center">Контракт выполнен</h2><div class="reveal" style="--c:${S[it.i][2]}">${card(it)}<div><b style="color:${S[it.i][2]}">${it.n}</b><br>${fmt(it.p)} за ${fmt(v)}</div></div><button class="btn" onclick="closeM()">Отлично</button>`);if(it.p>v)boom();go()}
go();

</script></body></html>
